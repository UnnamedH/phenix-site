<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>En construction · Le Trône de Phoenixia</title>
  <meta name="description" content="Chers membres, le royaume est en cours de chargement, merci de patienter !">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#4a8fdc">
  <link rel="icon" href="images/logo/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="images/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="maint">
  <canvas id="kingdom" class="kingdom" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <header class="hero">
    <div class="sign">
      <img class="logo" src="images/logo/phenix-mark-192.png" width="72" height="72" alt="Troupe Phénix" fetchpriority="high">
      <div class="sign-text">
        <p class="sign-eyebrow"><span>Troupe Phénix</span> · <span>2026–2027</span></p>
        <h1 translate="no">Le Trône de Phoenixia</h1>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="panel build" aria-labelledby="build-title">
      <h2 id="build-title">En construction</h2>
      <div class="dialog">
        <p class="dialog-name">Le héraut du royaume</p>
        <p class="dialog-more">Chers membres, le royaume est en cours de chargement, merci de patienter&nbsp;! <span class="blink" aria-hidden="true">▼</span></p>
      </div>
      <div class="build-bar" role="progressbar" aria-label="Chargement du royaume">
        <p class="build-label">Chargement…</p>
        <div class="bar" style="--c:#e0a526"><div class="bar-fill" style="--p:.6"></div></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p translate="no">Royaume de Phoenixia</p>
  </footer>

  <script src="kingdom.js"></script>
  <script>
    PhenixArt.paintKingdom(document.getElementById("kingdom"), [["#8a5a32", "#f2f1ec"], ["#d83a2e", "#f5c518"], ["#26262c", "#f2f1ec"], ["#f08a24", "#2f7fe0"]]);
  </script>
</body>
</html>
